# Consultas ao Google News (uma requisicao cada). `when:1d` limita a busca a 24 h;
# a janela acima corta o resto. Grupos por tema para caber em ~14 requisicoes.
consultas:
  - {id: br_bancos, lang: pt-BR, q: '(Itaú OR Itau OR Bradesco OR "Banco do Brasil" OR Itaúsa OR Itausa) (resultado OR lucro OR dividendos OR JCP OR guidance OR "fato relevante" OR provisão OR inadimplência OR CEO OR aquisição)'}
  - {id: br_petro_vale, lang: pt-BR, q: '(Petrobras OR Vale OR Ultrapar OR Ipiranga) (resultado OR dividendos OR "fato relevante" OR preço OR produção OR minério OR acordo OR multa OR conselho OR CEO OR investimento)'}
  - {id: br_utilities, lang: pt-BR, q: '(Equatorial OR Sanepar OR Alupar OR Sabesp OR Axia OR Eletrobras) (resultado OR dividendos OR "fato relevante" OR leilão OR tarifa OR concessão OR aquisição OR Aneel OR Arsesp OR privatização)'}
  - {id: br_outros, lang: pt-BR, q: '(Klabin OR "Mercado Livre" OR Direcional OR MRV OR "small caps") (resultado OR dividendos OR "fato relevante" OR celulose OR lançamentos OR "Minha Casa" OR guidance OR aquisição)'}
  - {id: br_macro, lang: pt-BR, q: '(Copom OR Selic OR "Banco Central" OR IPCA OR "Tesouro Direto" OR "curva de juros" OR "risco fiscal") (decisão OR ata OR alta OR corte OR projeção OR leilão OR déficit)'}
  - {id: br_cambio, lang: pt-BR, q: '(dólar OR câmbio OR "real brasileiro") (fecha OR abre OR sobe OR cai OR "Banco Central" OR leilão OR fluxo)'}
  - {id: us_semis, lang: en-US, q: '(Micron OR Nvidia OR TSMC OR "Taiwan Semiconductor") (earnings OR guidance OR revenue OR "data center" OR HBM OR export OR tariff OR outlook)'}
  - {id: us_bigtech, lang: en-US, q: '(Alphabet OR Google OR Amazon OR AWS) (earnings OR antitrust OR DOJ OR capex OR guidance OR cloud OR lawsuit OR ruling)'}
  - {id: us_bancos, lang: en-US, q: '("JPMorgan" OR "Bank of America") (earnings OR guidance OR "net interest" OR Dimon OR Moynihan OR provision OR buyback OR dividend)'}
  - {id: us_defensivos, lang: en-US, q: '("Coca-Cola" OR Chevron OR 3M OR Nokia OR Alibaba) (earnings OR guidance OR dividend OR acquisition OR lawsuit OR settlement OR outlook OR Hess)'}
  - {id: us_macro, lang: en-US, q: '("Federal Reserve" OR Powell OR FOMC OR Treasury yields OR "10-year") (rate OR cut OR hike OR inflation OR payrolls OR CPI OR auction)'}
  - {id: commod, lang: en-US, q: '(Brent OR OPEC OR "iron ore" OR pulp OR Suzano) (price OR output OR cut OR supply OR demand OR China)'}
  - {id: cripto, lang: en-US, q: '(Bitcoin OR Ethereum OR "crypto ETF") (price OR SEC OR ETF OR inflow OR outflow OR halving OR hack)'}
  - {id: asia, lang: en-US, q: '(Kospi OR "South Korea" OR "China stocks" OR Hang Seng OR Alibaba) (stimulus OR tariff OR export OR chip OR rally OR selloff)'}

# Atribuicao: regex aplicadas ao titulo + descricao (sensiveis a maiusculas, salvo (?i)).
casar:
  ITUB4: ['(?i)\bIta[uú] ?Unibanco\b', '(?i)\bIta[uú]\b(?! ?Unibanco)', 'ITUB4']
  BBDC4: ['(?i)\bBradesco\b', 'BBDC4']
  BBAS3: ['(?i)\bBanco do Brasil\b', 'BBAS3']
  ITSA4: ['(?i)\bIta[uú]sa\b', 'ITSA4']
  PETR4: ['(?i)\bPetrobras\b', 'PETR4']
  VALE3: ['\bVale\b(?! (a|à|de|do|da|pena|tudo|mais|menos|muito|pouco|lembrar|dizer|ressaltar|notar|destacar))', 'VALE3', '(?i)\bVale S\.?A\.?\b']
  UGPA3: ['(?i)\bUltrapar\b', '(?i)\bIpiranga\b', 'UGPA3']
  EQTL3: ['(?i)\bEquatorial\b', 'EQTL3']
  SAPR4: ['(?i)\bSanepar\b', 'SAPR4', 'SAPR11']
  ALUP4: ['(?i)\bAlupar\b', 'ALUP4', 'ALUP11']
  SBSP3: ['(?i)\bSabesp\b', 'SBSP3']
  AXIA3: ['(?i)\bAxia\b', '(?i)\bEletrobras\b', 'AXIA3']
  KLBN4: ['(?i)\bKlabin\b', 'KLBN4', 'KLBN11']
  MELI34: ['(?i)\bMercado ?Livre\b', '(?i)\bMercadoLibre\b', 'MELI34', '\bMELI\b']
  DIRR3: ['(?i)\bDirecional\b', 'DIRR3']
  MRVE3: ['\bMRV\b', 'MRVE3']
  SMAL11: ['SMAL11', '(?i)\bsmall caps?\b']
  MU: ['(?i)\bMicron\b', '\bMU\b(?= (stock|shares))']
  NVDA: ['(?i)\bNvidia\b', '\bNVDA\b']
  TSM: ['(?i)\bTSMC\b', '(?i)\bTaiwan Semiconductor\b', '\bTSM\b']
  GOOGL: ['(?i)\bAlphabet\b', '\bGoogle\b', '\bGOOGL?\b']
  AMZN: ['(?i)\bAmazon\b', '\bAWS\b', '\bAMZN\b']
  JPM: ['(?i)\bJPMorgan\b', '(?i)\bJ\.?P\.? ?Morgan\b', '\bJPM\b', '(?i)\bDimon\b']
  BAC: ['(?i)\bBank of America\b', '\bBofA\b', '\bBAC\b', '(?i)\bMoynihan\b']
  KO: ['(?i)\bCoca-?Cola\b', '\bKO\b(?= (stock|shares))']
  CVX: ['(?i)\bChevron\b', '\bCVX\b']
  MMM: ['\b3M\b', '\bMMM\b']
  NOK: ['(?i)\bNokia\b', '\bNOK\b(?= (stock|shares))']
  BABA: ['(?i)\bAlibaba\b', '\bBABA\b']
  BRENT: ['(?i)\bBrent\b', '(?i)\bOPEC\+?\b', '(?i)\bOpep\b', '(?i)\bpetr[oó]leo\b(?!.*Petrobras)', '(?i)\boil prices?\b']
  MINERIO: ['(?i)\biron ore\b', '(?i)\bmin[eé]rio de ferro\b']
  USDBRL: ['(?i)\bd[oó]lar\b', '(?i)\bc[aâ]mbio\b', '(?i)\breal brasileiro\b', '(?i)\bBrazilian real\b']
  BTC: ['(?i)\bBitcoin\b', '\bBTC\b']
  ETH: ['(?i)\bEthereum\b', '(?i)\bEther\b', '\bETH\b']
  EWY: ['(?i)\bKospi\b', '(?i)\bSouth Korea(n)? (stocks|shares|market)\b']
  MCHI: ['(?i)\bChina stocks\b', '(?i)\bChinese (stocks|shares|equities)\b', '(?i)\bHang Seng\b', '(?i)\bCSI ?300\b']
  DI: ['(?i)\bCopom\b', '(?i)\bSelic\b', '(?i)\bcurva de juros\b', '(?i)\bjuros futuros\b', '(?i)\bDI futuro\b']
  TESOURO: ['(?i)\bTesouro Direto\b', '(?i)\bNTN-?B\b', '(?i)\bIPCA\+\b', '(?i)\bleil[aã]o do Tesouro\b']
  UST: ['(?i)\bTreasur(y|ies)\b', '(?i)\b10-year\b', '(?i)\bFederal Reserve\b', '(?i)\bFOMC\b', '(?i)\bPowell\b']

# Exclusoes: se a manchete casa um destes, o ativo NAO e atribuido mesmo com o nome presente.
excluir:
  NVDA: ['(?i)\bNvidia-?backed\b', '(?i)\bbacked by Nvidia\b']
  AMZN: ['(?i)\bPrime Video\b', '(?i)\bAmazon Prime\b', '(?i)\bAmazon (Music|Fresh|Basics|Alexa)\b', '(?i)\bAmazon (river|rainforest)\b', '(?i)\bAmaz[oô]nia\b']
  GOOGL: ['(?i)\bGoogle (Maps|Photos|Play|Pixel|Chrome|Doodle|Translate)\b']
  KO: ['(?i)\bCoca-?Cola (FEMSA|HBC|Europacific|Andina)\b']
  BABA: ['(?i)\bAlibaba (Cloud|Pictures|Health)\b']
  VALE3: ['(?i)\bVale (do|dos|das|da) \w', '(?i)\bVale (Verde|Encantado)\b']
  MELI34: ['(?i)\b(cupom|desconto|promo[cç][aã]o|Black Friday|ofertas?)\b']
  BTC: ['(?i)\bBitcoin (ETF|Cash|Gold|Depot|Magazine)\b(?!.*(price|pre[cç]o|inflow|outflow))', '(?i)^Crypto News', '(?i)\b(presale|meme ?coins?|DeFi exchange|airdrop|token launch|100x|pre-?venda)\b']
  ETH: ['(?i)^Crypto News', '(?i)\b(presale|meme ?coins?|DeFi exchange|airdrop|token launch|100x|pre-?venda)\b']
  DI: ['(?i)\bCopom\b.*\bata\b.*\bassembleia\b']
# Banco como previsor macro: "Bradesco revisa projecao da Selic" fala da Selic, nao da acao do banco.
# Se a manchete casa o padrao e o ativo esta na lista, o ativo sai da atribuicao (os macro ficam).
previsor_macro:
  padrao: '(?i)\b(Ita[uú]|Bradesco|Banco do Brasil|BB|Santander|BTG|XP|Safra|Goldman|JPMorgan|J\.?P\.? ?Morgan|Morgan Stanley|Bank of America|BofA|Citi|UBS|HSBC|Barclays|Genial|Ita[uú] BBA)\b[^:]{0,40}?\b(revisa|projeta|v[eê]|prev[eê]|estima|eleva|reduz|corta|mant[eé]m|piora|melhora|espera|sees|expects|forecasts|projects|raises|cuts|lowers|now sees)\b.{0,60}\b(proje[cç][aã]o|proje[cç][oõ]es|Selic|PIB|IPCA|infla[cç][aã]o|c[aâ]mbio|d[oó]lar|juros|GDP|inflation|rates?|Fed|target|Copom|FOMC)\b'
  ativos: [ITUB4, BBDC4, BBAS3, ITSA4, JPM, BAC]

# Materialidade: com uma destas, a noticia vira ATENCAO (mensagem propria); sem, vira INFO (linha).
materialidade_forte:
  - '(?i)\bfato relevante\b'
  - '(?i)\b(resultado|lucro|preju[ií]zo|earnings|profit|loss)\b.*\b(tri|trimestre|quarter|Q[1-4]|[1-4]T\d{2})\b'
  - '(?i)\b(guidance|proje[cç][aã]o|outlook)\b'
  - '(?i)\b(dividendos?|JCP|juros sobre capital|dividend|buyback|recompra)\b'
  - '(?i)\b(aquisi[cç][aã]o|compra|venda|fus[aã]o|acquisition|acquire|merger|deal|takeover)\b.*(R\$|US\$|\$|\bbilh|\bmilh|\bbillion|\bmillion)'
  - '(?i)\b(rebaixa|eleva|corta|raises|cuts|downgrade|upgrade)\b.*\b(rating|recomenda[cç][aã]o|pre[cç]o-alvo|price target|nota)\b'
  - '(?i)\b(CEO|presidente|diretor|conselho|chairman|CFO)\b.*\b(ren[uú]ncia|deixa|sai|assume|nomea|steps down|resigns|appoint|named)\b'
  - '(?i)\b(multa|processo|senten[cç]a|CADE|Justi[cç]a|lawsuit|ruling|antitrust|fine|settlement|penalty)\b'
  - '(?i)\b(greve|acidente|barragem|vazamento|explos[aã]o|strike|accident|spill|outage|recall)\b'
  - '(?i)\b(oferta|follow-on|IPO|emiss[aã]o|deb[eê]ntures|bond sale|offering)\b'
  - '(?i)\b(Copom|FOMC|Fed)\b.*\b(decide|mant[eé]m|eleva|corta|sobe|reduz|holds|hikes|cuts|raises)\b'
  - '(?i)\b(tarifa|tariff|sanction|san[cç][aã]o|export ban|proibi[cç][aã]o)\b'
  - '(?i)\b(guidance|capex|invest\w*|aposta|bets?)\b.*(R\$|US\$|\$)\s?\d'
  - '(?i)(R\$|US\$|\$)\s?\d[\d.,]*\s?(bi|bilh|billion|mi|milh|million)\w*\b.*\b(invest\w*|aposta|bets?|capex|plano|plan)\b'
  - '(?i)\bATH\b|\brecorde\b|\brecord high\b|\ball-time high\b'

# "Por que mexe o livro" por gatilho (o texto do analista vem da sessao; isto e o esqueleto).
por_que:
  resultado: "resultado trimestral reprecifica lucro, dividendos e multiplo; comparar com o consenso antes de comentar"
  dividendo: "provento muda o fluxo de caixa ao acionista e o yield; conferir data-com e valor por acao"
  ma: "aquisicao ou venda muda alavancagem, mix de receita e o multiplo; olhar preco pago e financiamento"
  rating: "mudanca de recomendacao mexe no fluxo de curto prazo; pesa mais quando vem com revisao de lucro"
  gestao: "troca no comando reabre a discussao de estrategia e de alocacao de capital"
  juridico: "contingencia muda o risco e pode virar provisao; olhar valor e prazo"
  operacional: "evento operacional afeta producao e custo no trimestre corrente"
  oferta: "oferta de acoes ou divida altera a base acionaria ou a alavancagem"
  macro: "decisao de politica monetaria reprecifica toda a curva e o cambio"
  tarifa: "tarifa ou sancao muda margem e acesso a mercado"
  padrao: "noticia material sobre um ativo do livro; ler o texto antes de comentar"

