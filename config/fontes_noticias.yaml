# Fontes de noticias e eventos do livro monitorado.
#
# Tres pernas:
#   1. noticias: busca no Google News (descoberta) por grupos de ativos; o item e
#      atribuido aos ativos pelas palavras-chave em `casar`; o link do Google e
#      trocado pela URL do veiculo; o TEXTO so e extraido onde a licenca permite.
#   2. cvm: fatos relevantes, comunicados ao mercado e avisos aos acionistas do
#      IPE (dados abertos da CVM), com o PDF lido por inteiro (fonte primaria).
#   3. sec: 8-K/6-K das companhias dos EUA (EDGAR), com o documento lido por
#      inteiro (fonte primaria). Exige o secret SEC_USER_AGENT.
#
# Licenca por veiculo (decisao do Douglas em 18/09):
#   integral  -> texto completo pode ser guardado e mostrado na sessao (fonte
#                primaria ou veiculo que permite uso interno)
#   resumo    -> 4-8 linhas de resumo fiel a partir da descricao do feed + link
#   manchete  -> so manchete + link (paywall ou termos restritivos)

janela_horas: 36          # item mais velho que isso nao vira alerta
max_resolver_por_run: 15  # links do Google resolvidos por execucao (2 requisicoes cada)
max_texto_chars: 6000
so_veiculos_conhecidos: true   # item de veiculo fora da lista abaixo e descartado (1o run real: 603 itens, quase tudo ruido)
max_por_consulta: 40           # itens lidos por consulta (o RSS devolve ate 100)
max_atencao_por_run: 12        # alertas de atencao por execucao (os mais recentes)
max_info_por_run: 15           # linhas de info por execucao; o resto fica so em eventos/noticias.json

veiculos:
  - {id: cvm, nome: "CVM (fato relevante)", dominios: [rad.cvm.gov.br, cvm.gov.br], licenca: integral, nota: "Fonte primaria; documento publico."}
  - {id: sec, nome: "SEC EDGAR", dominios: [sec.gov], licenca: integral, nota: "Fonte primaria; documento publico."}
  - {id: agenciabrasil, nome: "Agencia Brasil", dominios: [agenciabrasil.ebc.com.br], licenca: integral, nota: "Conteudo sob Creative Commons Atribuicao (citar a fonte)."}
  - {id: moneytimes, nome: "Money Times", dominios: [moneytimes.com.br], licenca: integral, nota: "Feed publico; uso interno do texto verificado em 28/08/2026 (tracknews)."}
