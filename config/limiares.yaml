  push: {critico: true, atencao_agrupado: true, info: false, teto_dia: 5}
  regime_vol:
    vix_minimo: 25
    ativos_minimos: 5        # n de ativos com vol20 >= razao * vol252
    razao_vol: 1.5
    acrescimo_sigma: 0.5
  frescor_max_dias: 1        # dado com mais de 1 sessao de atraso nao entra em regra

