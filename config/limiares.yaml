# Parametros das regras de alerta do livro (rulebook v1). Fora do codigo para o
# Douglas aprovar mudancas via PR. Percentuais em fracao (0.005 = 0,5%); bps em
# pontos-base; janelas em sessoes (barras) salvo indicacao.

versao: 1

geral:
  quiet_hours_brt: {inicio: "19:00", fim: "07:00"}
  teto_diario: {total: 6, critico: 2, atencao: 4, por_slot_atencao: 3, noticias_por_slot: 3, noticias_por_dia: 8, eventos_por_slot: 4, eventos_por_dia: 10}
  push: {critico: true, atencao_agrupado: true, info: false, teto_dia: 5}
  regime_vol:
    vix_minimo: 25
    ativos_minimos: 5        # n de ativos com vol20 >= razao * vol252
    razao_vol: 1.5
    acrescimo_sigma: 0.5
  frescor_max_dias: 1        # dado com mais de 1 sessao de atraso nao entra em regra

