# Livro monitorado do Douglas Lora - cadastro unico do universo.
#
# Cada ativo tem NOME POR EXTENSO (obrigatorio para UCITS), bloco de exibicao,
# classe (etf | acao | fx | indice | commodity | cripto), simbolo Yahoo, moeda,
# mercado (calendario/fuso em config/calendario.yaml), benchmark e notas.
# O runner grava uma copia renderizada em livro/universo.json no branch dados.
#
# Regras do livro (skills/livro-monitorado do tracknews): quem adiciona nome faz
# APPEND, nunca apaga o nucleo. EWY/MCHI sao hipotese ate o Douglas cravar.

versao: 1
atualizado_em: "2026-09-18"

# A ordem aqui e a ordem dos cards na entrega. O campo `titulo` e texto de tela,
# entao leva acento; ids, comentarios e o resto do arquivo seguem sem acento.
