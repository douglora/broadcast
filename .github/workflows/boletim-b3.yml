name: Boletim B3 (Boletim Diario do Mercado)

# Baixa o Boletim Diario do Mercado da B3 (cadernos em PDF e arquivos CSV da API de
# download) e grava em boletim_b3/ no branch `dados`. A sessao do Claude nao alcanca
# a B3; o Actions alcanca. Leitura na sessao: `git show origin/dados:boletim_b3/...`.
#
# FASE DE VALIDACAO: sem cron. O push no branch de desenvolvimento dispara a rodada de
# descoberta; o cron diario entra quando a descoberta confirmar arquivos e horario.

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Pregao AAAA-MM-DD (vazio = ultimo pregao B3)"
        required: false
        default: ""
        type: string
      dias:
        description: "Quantos pregoes para tras, a partir da data"
        required: false
        default: "1"
        type: string
      partes:
        description: "descoberta,pdf,arquivos"
        required: false
        default: "descoberta,pdf,arquivos"
        type: string
  push:
    branches: [claude/magical-hopper-18a6sh]
    paths:
      - "boletim_b3.py"
      - ".github/workflows/boletim-b3.yml"

permissions:
  contents: write

# Mesmo grupo dos outros coletores: um push por vez no branch dados
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o branch de dados
        uses: actions/checkout@v4
        with:
          ref: dados
          path: dados_branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-livro.txt

      - name: Coletar
        timeout-minutes: 20
        continue-on-error: true
        env:
          DATA: ${{ inputs.data }}
          DIAS: ${{ inputs.dias }}
          PARTES: ${{ inputs.partes }}
          EVENTO: ${{ github.event_name }}
        run: |
          # Push no branch de desenvolvimento = rodada de descoberta, dois pregoes
          if [ "$EVENTO" = "push" ]; then DIAS=2; PARTES="descoberta,pdf,arquivos"; fi
          python -u boletim_b3.py --saida dados_branch/boletim_b3 --data "$DATA" \
            --dias "${DIAS:-1}" --partes "${PARTES:-descoberta,pdf,arquivos}"

      - name: Guardar os PDFs como artefato da rodada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletim-b3-${{ github.run_id }}
          path: dados_branch/boletim_b3
          retention-days: 30
          if-no-files-found: ignore

      - name: Publicar no branch dados
        if: always()
        run: |
          cd dados_branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A boletim_b3
          if git diff --cached --quiet; then echo "Nada novo para gravar"; exit 0; fi
          git commit -q -m "Boletim B3: cadernos e arquivos do pregao ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            git push && break
            git pull --rebase -q && sleep 5
          done

      - name: Resumo
        if: always()
        run: |
          echo "### Boletim B3" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          p = "dados_branch/boletim_b3/manifest.json"
          if os.path.exists(p):
              m = json.load(open(p))
              for parte, v in m["partes"].items():
                  print(f"- **{parte}**: `{json.dumps(v, ensure_ascii=False)[:400]}`")
              for d, v in m["pregoes"].items():
                  print(f"- **{d}**: cadernos {v['cadernos']} | arquivos {v['arquivos']}")
              for f in m.get("falhas", [])[:20]:
                  print(f"  - falha: {f}")
          PY
